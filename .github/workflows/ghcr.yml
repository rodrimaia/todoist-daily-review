name: Validate and publish

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: validate-and-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Release validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Install browser used by route checks
        run: bunx playwright install --with-deps chromium

      - name: Test, typecheck, build, and browser-check
        run: bun run validate

      - name: Scan the release tree and complete Git history
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="/tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory /tmp gitleaks
          /tmp/gitleaks dir . --redact --no-banner
          /tmp/gitleaks git . --redact --log-opts=--all

      - name: Build and smoke-test Docker and Compose
        run: bun run test:container

  publish:
    name: Publish validated release image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install locked dependencies and browser
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest
            type=semver,pattern={{version}}

      - uses: docker/setup-buildx-action@v3

      - name: Build the releasable image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke-test the exact releasable image
        env:
          TODOIST_DAILY_REVIEW_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          TODOIST_DAILY_REVIEW_SKIP_BUILD: 'true'
        run: bun run test:container

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the exact smoke-tested image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then docker push "$tag"; fi
          done <<< "$IMAGE_TAGS"
