name: Validate and package clients

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Workspace and parity gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run release:gate

  package:
    name: Package TUI (${{ matrix.target }})
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux-x64, linux-arm64, darwin-x64, darwin-arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run package:release
        env:
          RELEASE_TARGETS: ${{ matrix.target }}
          GITHUB_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: todoist-review-tui-${{ matrix.target }}-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
