map $host $script_sources {
    default                 "'self'";
    review.rodrigomaia.me   "'self' https://umami.rodrigomaia.me/script.js";
}

map $host $connect_sources {
    default                 "'self' https://api.todoist.com";
    review.rodrigomaia.me   "'self' https://api.todoist.com https://umami.rodrigomaia.me/api/send";
}

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src $connect_sources; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; manifest-src 'self'; media-src 'none'; object-src 'none'; script-src $script_sources; style-src 'self' 'unsafe-inline'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location ^~ /assets/ {
        try_files $uri @asset_not_found;
    }

    location ~* \.(?:css|js|mjs|map|json|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|otf)$ {
        try_files $uri @asset_not_found;
    }

    location @asset_not_found {
        default_type text/plain;
        return 404 "Not found\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
